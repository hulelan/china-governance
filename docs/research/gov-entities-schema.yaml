# =========================================================================
# GENERATION -- how Dim A x Dim B produces concrete instances (not hand-listed)
# =========================================================================
generation:
  method: >
    For each geographic unit U in docs/working/china-admin-divisions.csv, and each
    template T in dept_taxonomy whose tier_floor <= U.level, emit an instance row:
      id = "<U.id>.<T.slug>"
      dimension = dept
      name_cn = T.name_cn_provincial with {unit} -> U.name_cn (swap 厅->局 below province rank)
      level = U.level
      parent_id = U.id                       # kuai (块) line: the local government
      counterpart_central_body = T.counterpart_central_body   # tiao (条) line
      official_url = null                     # to be discovered (see model doc §5)
      coverage_status = unknown
    A geo portal row (dimension=geo, id=U.id) is emitted once per U as well.
  naming_rule: >
    厅 (province) -> 局 (prefecture/county) for most 组成部门 mirrors; 委员会 stays
    委员会; vertically-managed systems keep their central-prefixed name (税务局, 海关).
  rough_counts:
    central_tree_rows: "~90 in this file (constituent 26 + subordinate ~12 + bureaus ~20 + party ~12 + NPC/CPPCC 2 + judicial 3 + military 4 + mass orgs 4 + standards/stats 3). The full long tail of 直属单位/研究院 under each ministry would add several hundred more."
    dept_templates: "~44 (23 core + ~14 直属机构-mirror + 3 vertical + 7 party-side)"
    provincial_instances: "34 units x ~40 depts ~= 1,360"
    prefecture_instances: "~333 units x ~33 depts ~= ~11,000"
    county_instances: "~2,844 units x ~28 depts ~= ~80,000"
    township_instances: "~38,000 units x a few offices ~= 100,000+ (rarely own a portal; publish on the parent county site)"
    note: >
      These are ENTITY counts, not website counts. Below prefecture, most departments
      do NOT run an independent portal -- they publish under the county government's
      单位 sections. The count of distinct crawlable WEBSITES is far smaller: roughly
      3,200 general-government portals (central+province+prefecture+county) plus a few
      thousand department subdomains that exist mainly at province and big-city level.
      So the crawl target set is ~5,000-8,000 live sites, not ~90,000 entities.
