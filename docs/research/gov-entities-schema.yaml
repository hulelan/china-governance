# =========================================================================
# DIM B -- DEPARTMENT TAXONOMY BACKBONE (reusable TEMPLATE rows, not instances)
# =========================================================================
# Each row is a TYPE. name_cn_provincial uses 厅/委/局 (province rank); the same
# body is a 局 at prefecture and county rank. `counterpart_central_body` is the id
# of the Dim C body it 对口. To instantiate: for each geographic unit U in Dim A,
# emit a row id "<U>.<dept_slug>" with parent_id=U. See `generation` below.
#
# `tier_floor` = lowest geographic level at which this department reliably exists
# as its own body (some bodies stop at prefecture; some run to township).
# `vertical` = true where the tiao (条) line dominates (staff/budget controlled
# from above, e.g. customs/tax/SAFE) rather than the local kuai (块) government.

dept_taxonomy:
  # --- Core 组成部门-mirroring departments (present at province + prefecture + county) ---
  - {slug: fgw,     name_cn_provincial: "{unit}发展和改革委员会",       name_en: Development & Reform Commission,           counterpart_central_body: ndrc,   body_type: department, tier_floor: county, vertical: false}
  - {slug: edu,     name_cn_provincial: "{unit}教育厅",                 name_en: Education Department/Bureau,               counterpart_central_body: moe,    body_type: department, tier_floor: county, vertical: false}
