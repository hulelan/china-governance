# gov-entities-schema.yaml
#
# Unified entity table for the 3-dimensional model of the Chinese party-state.
# See docs/research/gov-3d-model.md for the narrative model this data serves.
#
# GOAL: one canonical entity -> one row -> one official_url -> one coverage_status.
# This file is a STARTER seed. It is populated with:
#   - the full Dim C central tree (State Council + party + NPC/CPPCC + judicial +
#     military + mass orgs), one row per body, and
#   - the Dim B department taxonomy backbone (the ~40 provincial 厅/委/局 and the
#     municipal 局 that replicate across every geographic unit), as TEMPLATE rows.
# It does NOT enumerate the geographic x department cross-product (that is
# generated, not hand-listed -- see the `generation` block at the bottom and
# §4 of the model doc for the row-count math).
#
# Last authored: 2026-09-09. Coverage flags are a snapshot; refresh them by
# joining `official_url` / `site_key` against docs/working/coverage-sites-snapshot.tsv
# and the reachability tiers in docs/working/source-access-map.md.

schema:
  description: >
    Row shape for every distinct governing body we want to account for. A row is
    a canonical ENTITY (a body that could own a website), not a document and not
    a geographic place on its own. Geographic places become entities only when
    crossed with a department (Dim B) or when the place's own general government
    portal is the entity (e.g. 广东省人民政府).
  fields:
    id:
      type: string
      desc: Stable slug, unique across the table. Convention -> see id_conventions.
    dimension:
      type: enum[geo, dept, central]
      desc: >
        Which axis the entity primarily lives on. `central` = a node in the Dim C
        central tree. `dept` = a Dim B department TEMPLATE (the reusable type) OR a
        concrete department instance once generated. `geo` = a general-government
        portal of a geographic unit (the Dim A place itself, e.g. a province or
        city government portal).
    name_cn:
      type: string
      desc: Official Chinese name. For a Dim B template this is the pattern with
            a {unit} placeholder, e.g. "{unit}发展和改革委员会".
    name_en:
      type: string
    level:
      type: enum[central, provincial, prefecture, county, township]
      desc: Administrative rank of the geographic unit the entity sits in.
    body_type:
      type: enum[constituent, special_agency, directly_subordinate, public_institution,
                 national_bureau, party_organ, legislature, consultative, judicial,
                 procuratorate, supervisory, military, mass_org, gov_portal, department,
                 sub_unit]
      desc: The structural category. Drives how we expect it to publish.
    parent_id:
      type: string|null
      desc: id of the body this reports up to (tiao 条 line) OR the geo unit it
            belongs to (kuai 块 line). For central bureaus this is the parent
            ministry; for a provincial dept instance this is the province portal.
    counterpart_central_body:
      type: string|null
      desc: >
        id of the central ministry/commission this body 对口 (mirrors). Null for
        central bodies and for places. This is the KEY that ties a local 生态环境厅
        back to 生态环境部 and makes cross-level policy-diffusion queries possible.
    reorg_note:
      type: string|null
      desc: >
        Reorganization history -- merged / renamed / moved / created. Include the
        year and the predecessor->successor relationship. See predecessor_ids.
    predecessor_ids:
      type: list[string]|null
      desc: ids (or free-text names if the predecessor predates this table) of the
            bodies whose functions this entity absorbed.
    official_url:
      type: string|null
      desc: Canonical portal URL. null = unknown / no public portal.
    site_key:
      type: string|null
      desc: documents.db site_key if we already ingest it; null otherwise.
    coverage_status:
      type: enum[crawled, reachable_uncrawled, proxy_gated, anti_bot, spa_gated,
                 no_portal, unknown]
      desc: >
        Aligns with source-access-map.md tiers. crawled=Tier A; reachable_uncrawled=Tier B;
        proxy_gated=Tier C; anti_bot=Tier D; spa_gated=Tier E; no_portal=Tier F.
  id_conventions:
    central: "bare slug, e.g. ndrc, mof, cac"
    central_bureau: "parent-prefixed, e.g. ndrc.nea, samr.cnipa"
    dept_template: "dept.<slug>, e.g. dept.fgw (a TYPE, not an instance)"
    dept_instance: "<geo_id>.<dept_slug>, e.g. gd.fgw, gd.shenzhen.fgw (generated)"
    geo_portal: "<geo_id>, e.g. gd, gd.shenzhen (matches china-admin-divisions ids)"

