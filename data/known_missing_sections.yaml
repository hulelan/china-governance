# Sections we KNOW a crawled site has and that we do not (or did not) crawl.
#
# Shown on /admin/sections beside each site's crawled sections. The section registry
# (scripts/build_section_registry.py) is derived from the crawler code and so can only
# describe what a crawler DECLARES; a section nobody configured is invisible to it.
# This file is where that gap is written down. It is hand-kept on purpose and must
# stay small: one row per section, with a URL someone can open.
#
# status
#   missing  the section exists, is reachable from the droplet, and no crawler reads it
#   broken   a crawler is configured for it and gets nothing (wrong path, template change)
#   blocked  not reachable from the droplet's NYC IP (WAF / TLS / challenge page)
#   added    a crawler now reads it. Keep the row: `found` + `note` say when and how,
#            and whether a one-time backfill is still owed.
#
# Every `example_url` was byte-checked from the droplet on the `found` date unless the
# note says otherwise. HTTP 200 alone was never accepted as reachable.
#
# Full audit table: docs/working/press-conference-coverage.md

