# Topic (SUBJECT) ontology for the corpus.
#
# This is a flat list of 29 POLICY-TOPIC categories — WHAT a document is ABOUT
# (its subject matter), NOT what KIND of document it is. It is ORTHOGONAL to:
#   - data/source_ontology.yaml   (who PUBLISHED it — a source-type tree)
#   - algo_doc_type / genre_typer (what GENRE it is — 通知/规定/意见)
#
# The 29 categories are adopted VERBATIM from reconnectchina.org's policy-topic
# facet, so our tagging aligns 1:1 with theirs. Documents are MULTI-LABEL: an
# 新能源汽车充电基础设施 doc is legitimately Energy + Transport + Infrastructure.
#
# HOW IT WORKS
#   - `scripts/rnd/classification/topic_typer.py` loads this file and, for each
#     category, compiles its `patterns` into one alternation regex. A document is
#     tagged with a category when >=1 of its patterns matches the (title [+ keywords
#     + optional body]). The number of DISTINCT patterns that hit is the match
#     strength, used to ORDER the returned labels (strongest topic first).
#   - Patterns are Python regex fragments, but almost all are plain substrings.
#     Matching is done on the raw CN text (no word segmentation needed).
#
# PRECISION DISCIPLINE (why the lists look the way they do)
#   - Titles almost always LEAD with the issuing organ ("XX市人民政府关于……").
#     So issuer-organ words that appear on nearly every doc (政府 / 人民政府 /
#     办公厅 / 委员会) are NEVER used as topic keys — they would tag everything.
#     Category keys describe the SUBJECT, not the issuer. (A few narrow issuer
#     bodies — e.g. 财政厅, 气象局 — are topically diagnostic and kept.)
#   - Bare high-frequency chars (安全 / 法 / 卫生 / 文化) that collide across
#     categories are AVOIDED in favor of distinctive bigrams (安全生产 vs 国家安全,
#     卫生健康 vs 环境卫生). This trades a little recall for a lot of precision.
#   - Genre words (条例/办法/规定/通知) are deliberately NOT topic keys — they're
#     the genre_typer's job. "Legal" here means judiciary/law-making SUBJECTS
#     (司法/法院/普法/执法), not "this happens to be a 条例".
#
# MAINTENANCE
#   - Add a distinctive term -> append to the right category's `patterns`.
#   - If a term is causing false positives, either delete it or lengthen it into
#     a more specific phrase. Re-run `topic_typer.py --sample 8000` to see the
#     coverage + per-topic distribution shift.
#   - Keep the 29 category IDs stable (they mirror reconnectchina); only edit
#     patterns.

